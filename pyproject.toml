[project]
name = "bidpilot"
version = "0.1.0"
description = "Evidence-aware B2G pursuit decision, strategy, and proposal Bid Room for Snowflake CoCo"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141.1",
  "mcp>=2,<3",
  "pandas>=2.2,<3",
  "pyarrow>=14.0.1,<24",
  "pypdf>=5,<7",
  "snowflake-snowpark-python>=1.53,<2",
  "streamlit>=1.47,<2",
  "uvicorn>=0.52.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyte>=0.8.2",
    "pytest>=8.3,<9",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
